name: Deploy to GitHub Pages

# Build the static reader and publish it to GitHub Pages on every push to
# main (and on demand via the Actions tab). The site is a plain static bundle
# plus a service worker, so nothing runs server-side.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissions the Pages deployment needs.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deployments at once; a newer push supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Every push to main ships, so a red test, lint or format check stops the
      # deploy here, before anything is built or published.
      - run: npm test

      - run: npm run lint

      - run: npm run format:check

      - run: npm run build

      # End-to-end: the built app in a real browser (phone + desktop sizes) —
      # import, read, resume, offline, updates. Chromium only, matching the
      # pinned @playwright/test version.
      - run: npx playwright install --with-deps chromium

      - run: npm run test:e2e

      - name: Keep the failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: test-results/
          retention-days: 7

      # Pages is already enabled on the repo (build type = GitHub Actions),
      # so this just wires up the deployment for the artifact upload.
      - uses: actions/configure-pages@v6

      # Upload the built site (dist/) as the Pages artifact.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
