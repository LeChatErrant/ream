<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ream Proofreading</title>
    <style>
      :root {
        --bg: #1f2129;
        --panel: #272a34;
        --line: #343844;
        --text: #c9cad3;
        --muted: #83848f;
        --accent: #8fb3ff;
        --del-bg: rgba(255, 107, 107, 0.16);
        --del: #ff8f8f;
        --ins-bg: rgba(120, 220, 150, 0.16);
        --ins: #8fe0a8;
        --ok: #6fcf97;
        --no: #eb7a7a;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.5 system-ui, -apple-system, sans-serif;
      }
      header {
        position: sticky;
        top: 0;
        z-index: 2;
        background: var(--bg);
        border-bottom: 1px solid var(--line);
        padding: 12px 16px;
        display: flex;
        flex-wrap: wrap;
        gap: 10px 16px;
        align-items: center;
      }
      h1 {
        font-size: 15px;
        margin: 0;
        font-weight: 600;
      }
      select,
      button,
      textarea {
        font: inherit;
        color: var(--text);
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
      }
      select {
        padding: 5px 8px;
      }
      button,
      a.btn {
        padding: 8px 14px;
        cursor: pointer;
      }
      a.btn {
        font: inherit;
        color: var(--text);
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        text-decoration: none;
      }
      a.btn:hover {
        border-color: var(--muted);
      }
      button:hover {
        border-color: var(--muted);
      }
      button.primary {
        background: #2f4a3a;
        border-color: #3e6b50;
      }
      button.danger {
        background: #4a2f33;
        border-color: #6b3e44;
      }
      kbd {
        font: 11px ui-monospace, monospace;
        color: var(--muted);
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 0 4px;
        margin-left: 6px;
      }
      .progress {
        flex: 1 1 260px;
        min-width: 200px;
      }
      .bar {
        height: 6px;
        background: var(--panel);
        border-radius: 3px;
        overflow: hidden;
        display: flex;
      }
      .bar i {
        display: block;
        height: 100%;
      }
      .stats {
        color: var(--muted);
        font-size: 12px;
        margin-top: 4px;
      }
      main {
        max-width: 860px;
        margin: 0 auto;
        padding: 20px 16px 120px;
      }
      .where {
        color: var(--muted);
        font-size: 12px;
      }
      .chips {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin: 10px 0 4px;
        align-items: center;
      }
      .chip {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        padding: 2px 8px;
        border-radius: 999px;
        background: var(--panel);
        border: 1px solid var(--line);
        color: var(--muted);
      }
      .chip.kind {
        color: var(--accent);
      }
      .chip.status-accepted {
        color: var(--ok);
        border-color: var(--ok);
      }
      .chip.status-discarded {
        color: var(--no);
        border-color: var(--no);
      }
      .note {
        font-size: 15px;
        margin: 6px 0 16px;
      }
      .text {
        font-family: Merriweather, Georgia, serif;
        font-size: 16px;
        line-height: 1.8;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 18px 22px;
      }
      .text p {
        margin: 0 0 1em;
        white-space: pre-wrap;
      }
      .text p:last-child {
        margin-bottom: 0;
      }
      .text p.ctx {
        color: var(--muted);
        opacity: 0.6;
        font-size: 14px;
      }
      .text p.gone {
        background: var(--del-bg);
        color: var(--del);
        text-decoration: line-through;
        text-decoration-thickness: 1px;
      }
      .text p.dup {
        border-left: 3px solid var(--accent);
        padding-left: 10px;
      }
      del {
        background: var(--del-bg);
        color: var(--del);
        text-decoration-thickness: 1px;
      }
      ins {
        background: var(--ins-bg);
        color: var(--ins);
        text-decoration: none;
      }
      .label {
        font-size: 11px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.05em;
        margin: 18px 0 6px;
      }
      .actions {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        background: var(--bg);
        border-top: 1px solid var(--line);
        padding: 12px 16px;
        display: flex;
        gap: 8px;
        justify-content: center;
        flex-wrap: wrap;
      }
      textarea {
        width: 100%;
        min-height: 80px;
        padding: 10px;
        font-family: Merriweather, Georgia, serif;
      }
      .edit {
        display: none;
        margin-top: 12px;
      }
      .edit.open {
        display: block;
      }
      .empty {
        text-align: center;
        color: var(--muted);
        margin-top: 80px;
      }
      .tools {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
      }
      #log {
        white-space: pre-wrap;
        font: 12px ui-monospace, monospace;
        background: var(--panel);
        border-radius: 8px;
        padding: 10px;
        display: none;
        margin-top: 16px;
      }
      @media (max-width: 600px) {
        .text {
          padding: 14px;
          font-size: 15px;
        }
        kbd {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Proofreading</h1>
      <div class="tools">
        <select id="f-book"></select>
        <select id="f-kind"></select>
        <select id="f-status">
          <option value="pending">Pending</option>
          <option value="all">All</option>
          <option value="accepted">Accepted</option>
          <option value="discarded">Discarded</option>
        </select>
        <select id="f-source">
          <option value="">Any source</option>
          <option value="auto">Automatic</option>
          <option value="claude">Claude</option>
        </select>
      </div>
      <div class="progress">
        <div class="bar"><i id="b-ok" style="background: var(--ok)"></i><i id="b-no" style="background: var(--no)"></i></div>
        <div class="stats" id="stats"></div>
      </div>
      <div class="tools">
        <button id="bulk" title="Accept every pending finding matching the filters">Accept all shown…</button>
        <button id="apply" class="primary">Write corrected epubs</button>
        <a id="export-phone" class="btn" href="/api/proof/package" download title="Package every finding + the decisions so far, to import in Ream on the phone">Export for phone</a>
        <button id="import-phone" title="Merge the decisions exported from Ream on the phone">Import from phone</button>
        <input id="import-file" type="file" accept=".json,application/json" hidden />
      </div>
    </header>
    <main id="main"></main>
    <div class="actions">
      <button id="prev">Previous<kbd>K</kbd></button>
      <button id="discard" class="danger">Discard<kbd>D</kbd></button>
      <button id="edit">Edit<kbd>E</kbd></button>
      <button id="other" style="display: none">Delete other copy<kbd>O</kbd></button>
      <button id="accept" class="primary">Accept<kbd>A</kbd></button>
      <button id="next">Skip<kbd>J</kbd></button>
      <button id="undo">Undo<kbd>U</kbd></button>
    </div>
    <script>
      const $ = (s) => document.querySelector(s)
      const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c])
      const vis = (s) => esc(s).replace(/[​-‍⁠﻿]/g, '<span title="invisible character" style="color:var(--del)">⍽</span>')
      let all = []
      let decisions = {}
      let list = []
      let pos = 0
      const history = []
      const trail = [] // ids in the order they were shown, for Previous
      const status = (f) => decisions[f.id]?.status ?? 'pending'

      async function load() {
        const r = await (await fetch('/api/data')).json()
        all = r.findings
        decisions = r.decisions
        const books = [...new Set(all.map((f) => f.book))]
        const vol = Object.fromEntries(all.map((f) => [f.book, f.volume]))
        $('#f-book').innerHTML = `<option value="">All volumes</option>` + books.map((b) => `<option value="${b}">${esc(vol[b])}</option>`).join('')
        const kinds = [...new Set(all.map((f) => f.kind))].sort()
        $('#f-kind').innerHTML = `<option value="">All kinds</option>` + kinds.map((k) => `<option>${k}</option>`).join('')
        restoreFilters()
        refilter(true)
      }

      function restoreFilters() {
        try {
          const s = JSON.parse(localStorage.getItem('proof-filters') || '{}')
          for (const k of ['book', 'kind', 'status', 'source']) if (s[k] != null) $(`#f-${k}`).value = s[k]
        } catch {}
      }
      function saveFilters() {
        try {
          localStorage.setItem('proof-filters', JSON.stringify({ book: $('#f-book').value, kind: $('#f-kind').value, status: $('#f-status').value, source: $('#f-source').value }))
        } catch {}
      }

      function refilter(keepPlace) {
        const cur = list[pos]?.id
        const b = $('#f-book').value
        const k = $('#f-kind').value
        const s = $('#f-status').value
        const src = $('#f-source').value
        list = all.filter((f) => (!b || f.book === b) && (!k || f.kind === k) && (!src || f.source === src) && (s === 'all' || status(f) === s))
        pos = keepPlace && cur ? Math.max(0, list.findIndex((f) => f.id === cur)) : 0
        saveFilters()
        render()
      }

      function stats() {
        const n = all.length
        const ok = all.filter((f) => status(f) === 'accepted').length
        const no = all.filter((f) => status(f) === 'discarded').length
        $('#b-ok').style.width = (100 * ok) / n + '%'
        $('#b-no').style.width = (100 * no) / n + '%'
        $('#stats').textContent = `${ok + no} / ${n} reviewed · ${ok} accepted · ${no} discarded · ${n - ok - no} pending` + (list.length ? ` — showing ${pos + 1} of ${list.length}` : '')
      }

      function diff(a, b) {
        // Trim the common prefix/suffix so only the change is highlighted.
        let i = 0
        while (i < a.length && i < b.length && a[i] === b[i]) i++
        let j = 0
        while (j < a.length - i && j < b.length - i && a[a.length - 1 - j] === b[b.length - 1 - j]) j++
        return vis(a.slice(0, i)) + (a.slice(i, a.length - j) ? `<del>${vis(a.slice(i, a.length - j))}</del>` : '') + (b.slice(i, b.length - j) ? `<ins>${vis(b.slice(i, b.length - j))}</ins>` : '') + vis(a.slice(a.length - j))
      }

      function replacementOf(f) {
        return decisions[f.id]?.replacement ?? f.replacement
      }

      function render() {
        stats()
        const f = list[pos]
        if (f && trail.at(-1) !== f.id) trail.push(f.id)
        $('#other').style.display = f?.dupOf ? '' : 'none'
        if (!f) {
          $('#main').innerHTML = `<div class="empty">Nothing ${$('#f-status').value === 'pending' ? 'left to review' : 'here'} with these filters.</div>`
          return
        }
        const d = decisions[f.id]
        const range = f.para == null ? '' : ` · ¶${f.para}${f.paraEnd != null && f.paraEnd !== f.para ? '–' + f.paraEnd : ''}`
        let body = ''
        const ctx = (t) => (t == null ? '' : `<p class="ctx">${vis(t.length > 400 ? t.slice(0, 400) + '…' : t)}</p>`)
        if (f.op === 'title') body = `<div class="text"><p>${diff(f.original, replacementOf(f))}</p></div>`
        else if (f.op === 'delete-paras') {
          const other = d?.choice === 'other'
          body = `<div class="text">${ctx(f.prev)}${f.paras.map((p) => `<p class="${other ? 'dup' : 'gone'}">${vis(p)}</p>`).join('')}${ctx(f.next)}</div>`
          if (f.dupParas)
            body += `<div class="label">Other copy — ¶${f.dupOf.para}${f.dupOf.paraEnd !== f.dupOf.para ? '–' + f.dupOf.paraEnd : ''}</div><div class="text">${f.dupParas.map((p) => `<p class="${other ? 'gone' : 'dup'}">${vis(p)}</p>`).join('')}</div>`
        } else if (f.op === 'split-para') body = `<div class="text">${ctx(f.prev)}${f.replacement.split('\n\n').map((p) => `<p class="dup">${vis(p)}</p>`).join('')}${ctx(f.next)}</div>`
        else {
          const p = f.paras[0]
          const at = p.indexOf(f.original)
          const shown = at < 0 ? diff(f.original, replacementOf(f)) : vis(p.slice(0, at)) + diff(f.original, replacementOf(f)) + vis(p.slice(at + f.original.length))
          const joined = f.joined != null ? `<p class="gone">${vis(f.joined)}</p>` : ''
          body = `<div class="text">${ctx(f.prev)}<p>${shown}</p>${joined}${ctx(f.next)}</div>`
        }
        $('#main').innerHTML = `
          <div class="where">${esc(f.volume)} · ${esc(f.chapter)}${range}</div>
          <div class="chips">
            <span class="chip kind">${esc(f.kind)}</span>
            <span class="chip">${f.source === 'auto' ? 'automatic' : 'claude'}</span>
            ${f.confidence ? `<span class="chip">${esc(f.confidence)} confidence</span>` : ''}
            <span class="chip status-${status(f)}">${status(f)}${d?.choice === 'other' ? ' (other copy)' : ''}${d?.replacement != null ? ' (edited)' : ''}</span>
          </div>
          <div class="note">${esc(f.note)}</div>
          ${body}
          <div class="edit" id="edit-box">
            <div class="label">Replacement</div>
            <textarea id="edit-text"></textarea>
            <div style="margin-top: 8px; display: flex; gap: 8px">
              <button id="edit-save" class="primary">Accept edited<kbd>⌘↵</kbd></button>
              <button id="edit-cancel">Cancel<kbd>Esc</kbd></button>
            </div>
          </div>`
        $('#edit-save').onclick = saveEdit
        $('#edit-cancel').onclick = () => $('#edit-box').classList.remove('open')
      }

      async function decide(updates) {
        for (const [id, v] of Object.entries(updates)) {
          history.push({ id, before: decisions[id] ?? null })
          if (v === null) delete decisions[id]
          else decisions[id] = v
        }
        await fetch('/api/decisions', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(updates) })
      }

      async function set(statusValue, extra = {}) {
        const f = list[pos]
        if (!f) return
        await decide({ [f.id]: { status: statusValue, ...extra } })
        advance()
      }

      function advance() {
        // In "pending" view the decided item drops out of the list; elsewhere, move on.
        if ($('#f-status').value === 'pending') {
          list.splice(pos, 1)
          if (pos >= list.length) pos = Math.max(0, list.length - 1)
        } else if (pos < list.length - 1) pos++
        render()
      }

      function openEdit() {
        const f = list[pos]
        if (!f || f.op === 'delete-paras' || f.op === 'split-para') return
        $('#edit-box').classList.add('open')
        const t = $('#edit-text')
        t.value = replacementOf(f)
        t.focus()
      }
      function saveEdit() {
        set('accepted', { replacement: $('#edit-text').value })
      }

      $('#accept').onclick = () => set('accepted', decisions[list[pos]?.id]?.replacement != null ? { replacement: decisions[list[pos].id].replacement } : {})
      $('#discard').onclick = () => set('discarded')
      $('#other').onclick = () => set('accepted', { choice: 'other' })
      $('#edit').onclick = openEdit
      $('#next').onclick = () => {
        if (pos < list.length - 1) pos++
        render()
      }
      // Previous walks back through what was actually viewed — including items just
      // decided, which have already left the "Pending" list — so they can be revisited.
      $('#prev').onclick = () => {
        if (trail.at(-1) === list[pos]?.id) trail.pop()
        const id = trail.at(-1)
        if (!id) {
          if (pos > 0) pos--
          return render()
        }
        let j = list.findIndex((f) => f.id === id)
        if (j < 0) {
          list.splice(pos, 0, all.find((f) => f.id === id))
          j = pos
        }
        pos = j
        render()
      }
      $('#undo').onclick = async () => {
        const h = history.pop()
        if (!h) return
        if (h.before === null) delete decisions[h.id]
        else decisions[h.id] = h.before
        await fetch('/api/decisions', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ [h.id]: h.before }) })
        refilter(false)
        const j = list.findIndex((f) => f.id === h.id)
        if (j >= 0) pos = j
        render()
      }
      $('#bulk').onclick = async () => {
        const pending = list.filter((f) => status(f) === 'pending')
        if (!pending.length) return
        if (!confirm(`Accept all ${pending.length} pending findings currently shown?`)) return
        await decide(Object.fromEntries(pending.map((f) => [f.id, { status: 'accepted', bulk: true }])))
        refilter(false)
      }
      $('#apply').onclick = async () => {
        const btn = $('#apply')
        btn.disabled = true
        btn.textContent = 'Writing…'
        const r = await (await fetch('/api/apply', { method: 'POST' })).json()
        btn.disabled = false
        btn.textContent = 'Write corrected epubs'
        let log = document.getElementById('log')
        if (!log) {
          log = document.createElement('div')
          log.id = 'log'
          $('main').after(log)
        }
        log.style.display = 'block'
        log.textContent = (r.ok ? '✓ ' : '✗ ') + r.log + `\n${r.out}`
        $('#main').prepend(log)
      }
      $('#import-phone').onclick = () => $('#import-file').click()
      $('#import-file').onchange = async (e) => {
        const file = e.target.files[0]
        e.target.value = ''
        if (!file) return
        let r
        try {
          r = await (await fetch('/api/proof/merge', { method: 'POST', headers: { 'content-type': 'application/json' }, body: await file.text() })).json()
        } catch (err) {
          r = { ok: false, error: String(err) }
        }
        if (!r.ok) return alert(`Couldn't merge ${file.name}:\n${r.error}`)
        alert(`Merged ${file.name}: ${r.added} new decisions, ${r.updated} updated, ${r.older} kept (newer here)${r.unknown ? `, ${r.unknown} unknown` : ''}.`)
        await load()
      }
      for (const id of ['#f-book', '#f-kind', '#f-status', '#f-source']) $(id).onchange = () => refilter(false)

      document.addEventListener('keydown', (e) => {
        if (e.target.tagName === 'TEXTAREA') {
          if (e.key === 'Escape') $('#edit-box').classList.remove('open')
          if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) saveEdit()
          return
        }
        if (e.target.tagName === 'SELECT' || e.metaKey || e.ctrlKey || e.altKey) return
        const k = e.key.toLowerCase()
        const map = { a: '#accept', enter: '#accept', d: '#discard', backspace: '#discard', e: '#edit', o: '#other', j: '#next', arrowright: '#next', k: '#prev', arrowleft: '#prev', u: '#undo' }
        if (map[k]) {
          e.preventDefault()
          if (k === 'o' && $('#other').style.display === 'none') return
          $(map[k]).click()
        }
      })
      load()
    </script>
  </body>
</html>
